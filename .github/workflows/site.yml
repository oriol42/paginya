# Publie le site sur Cloudflare Pages à chaque push qui touche web/ (le serveur, lui, est reconstruit par Render).
name: Site
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_dispatch:
concurrency: { group: site, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: https://paginya-api.onrender.com
          NEXT_PUBLIC_SITE_URL: https://paginya.pages.dev
          NEXT_PUBLIC_GOOGLE_VERIFICATION: RVuG1OYgGURXD12C4d-NQdtZHxL-0lDuS_ixWnZsiYs
      - run: npx --yes wrangler@4 pages deploy out --project-name paginya --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

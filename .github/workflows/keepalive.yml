# Wakes the two free servers every 6 hours (Hugging Face sleeps after 48 h without visits,
# Supabase pauses after 7 days without activity: /health touches the database).
name: keep-alive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://ayebare-paginya-api.hf.space" "https://ayebare-affichya-api.hf.space"; do
            curl -fsS --retry 3 --retry-delay 20 --max-time 180 "$u/health" && echo " ← $u"
          done

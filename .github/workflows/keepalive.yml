# Free servers on Render sleep after 15 min and wake in ~1 min. Budget: 750 h/month for both.
# Affichya: 7h–21h Cameroon (14 h/day, its links are opened by customers) → ~420 h.
# Paginya: 9h–19h Cameroon (10 h/day, students work in the day) → ~300 h. Total ~720 h.
# Outside those hours each site wakes its server as soon as it is opened (WakeServer.tsx).
# The same call touches the database, so Supabase never pauses either.
name: keep-alive
on:
  schedule:
    - cron: "*/10 6-19 * * *"   # UTC = Cameroon time − 1 h
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 --max-time 180 "https://affichya-api.onrender.com/health"
      - name: Paginya (8h–17h UTC)
        run: |
          h=$(date -u +%H)
          if [ "$h" -ge 8 ] && [ "$h" -le 17 ]; then curl -fsS --retry 3 --retry-delay 30 --max-time 180 "https://paginya-api.onrender.com/health"; fi

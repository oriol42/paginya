# Free servers on Render sleep after 15 min and wake in ~1 min. Budget: 750 h/month for both.
# Affichya stays awake 6h–22h Cameroon time (its links are opened by customers); Paginya wakes on demand.
# The same call touches the database, so Supabase never pauses either.
name: keep-alive
on:
  schedule:
    - cron: "*/10 5-20 * * *"   # UTC = Cameroon time − 1 h
    - cron: "0 3 * * *"         # once at night: Paginya + database
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 --max-time 180 "https://affichya-api.onrender.com/health"
      - if: github.event.schedule == '0 3 * * *'
        run: curl -fsS --retry 3 --retry-delay 30 --max-time 180 "https://paginya-api.onrender.com/health"
